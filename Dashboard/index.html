<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="img/logo.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkyByte Dashboard</title>
</head>
<body>
    <div class="header">
        <img src="img/logo.png" alt="Logo" class="logo">
        <h1>SkyByte Dashboard</h1>
    </div>
    <div class="main">
        <div class="content">
            <div class="graph">
                Temperature
                <canvas class="line-graph"></canvas>
            </div>
        </div>
        <div class="content">
            <div class="graph">
                Pressure
                <canvas class="line-graph"></canvas>
            </div>
        </div>
        <div class="content">
            <div class="graph">
                Altitude
                <canvas class="line-graph"></canvas>
            </div>
        </div>
        <div class="content">
            <div class="graph">
                Map
                <canvas class="line-graph"></canvas>
            </div>
        </div>
    </div>
    <div class="data">
        <div class="data-left">
            <div class="data-item">Temperature: <span id="temperature">--</span> °C</div>
            <div class="data-item">Pressure: <span id="pressure">--</span> hPa</div>
            <div class="data-item">Altitude: <span id="altitude">--</span> m</div>
            <div class="data-item">HDOP: <span id="hdop">--</span></div>
        </div>
        <div class="data-right">
            <div class="data-item">Current Latitude: <span id="current-latitude">--</span></div>
            <div class="data-item">Current Longitude: <span id="current-longitude">--</span></div>
            <div class="data-item">Start Latitude: <span id="start-latitude">--</span></div>
            <div class="data-item">Start Longitude: <span id="start-longitude">--</span></div>
        </div>
    </div>
    <div class="footer">
        <p>&copy; 2026 SkyByte. All rights reserved.</p>
    </div>
</body>
</html>
