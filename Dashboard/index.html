<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="CSS/CanSat.css">
    <link rel="icon" href="img/logo.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkyByte Dashboard</title>
</head>
<body>
    <div class="header">
        <img src="img/logo.png" alt="Logo" class="logo">
        <h1>SkyByte Dashboard</h1>
    </div>
    <div class="main">
        <div class="content">
            <div class="graph">
                Temperature
                <canvas class="line-graph"></canvas>
            </div>
        </div>
        <div class="content">
            <div class="graph">
                Pressure
                <canvas class="line-graph"></canvas>
            </div>
        </div>
        <div class="content">
            <div class="graph">
                Altitude
                <canvas class="line-graph"></canvas>
            </div>
        </div>
        <div class="content">
            <div class="graph">
                Map
                <canvas class="line-graph"></canvas>
            </div>
        </div>
    </div>
</body>
</html>
